<!DOCTYPE html><html lang="es" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXBOX — Administración</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>tailwind.config={theme:{extend:{colors:{pix:{bg:'#050811',surface:'#0b1121',card:'#10182d',border:'#1e2d4d',blue:'#00a8ff',electric:'#38bdf8'}}}}}</script><style>body{background:#050811;color:#f8fafc;font-family:Inter,system-ui,sans-serif}</style></head><body class="min-h-screen"><script>const db=window.supabase.createClient('https://sjsrvjspoqtxcdyeedys.supabase.co','sb_publishable__x764MhZRrBO8WhLtlNi9A_nfXK-SIl');</script>
<header class="border-b border-pix-border bg-pix-surface"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div><h1 class="text-xl font-extrabold">PIXBOX <span class="text-pix-electric">Administración</span></h1><p class="text-xs text-slate-400">Panel privado de gestión</p></div><a href="index.html" class="text-xs text-pix-electric">Ver tienda ↗</a></div></header>
<main class="max-w-6xl mx-auto p-4 sm:p-6"><section id="loginPanel" class="max-w-md mx-auto mt-12 bg-pix-surface border border-pix-border rounded-2xl p-6"><h2 class="text-lg font-bold mb-2">Ingreso de administrador</h2><p class="text-xs text-slate-400 mb-4">Ingresá con la cuenta administradora de PIXBOX.</p><form id="loginForm" class="space-y-3"><input id="email" type="email" required placeholder="Correo electrónico" class="w-full bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"><input id="password" type="password" required placeholder="Contraseña" class="w-full bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"><button class="w-full bg-pix-blue text-slate-950 font-bold rounded-xl p-3">Ingresar</button></form><p id="loginMessage" class="text-xs mt-3 text-rose-300"></p></section>
<section id="adminPanel" class="hidden space-y-8"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="text-2xl font-bold">Panel de control</h2><p class="text-sm text-slate-400">Revisá publicaciones y administrá la tienda oficial.</p></div><button onclick="logout()" class="border border-pix-border rounded-xl px-4 py-2 text-sm">Cerrar sesión</button></div>
<section><div class="flex justify-between items-center mb-3"><h3 class="text-xl font-bold">Publicaciones pendientes <span id="pendingCount" class="text-amber-300"></span></h3><button onclick="loadPending()" class="text-xs text-pix-electric">Actualizar</button></div><div id="pendingList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></section>
<section class="border-t border-pix-border pt-7"><h3 class="text-xl font-bold mb-4">Agregar producto nuevo a la tienda PIXBOX</h3><form id="productForm" class="bg-pix-surface border border-pix-border rounded-2xl p-4 grid grid-cols-1 md:grid-cols-2 gap-3"><input id="pTitle" required placeholder="Nombre del producto" class="bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"><select id="pCategory" class="bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"><option value="informatica">Informática y PC</option><option value="consolas">Consolas y Juegos</option><option value="perifericos">Periféricos y Monitores</option><option value="componentes">Componentes</option></select><input id="pPrice" type="number" min="1" required placeholder="Precio ARS" class="bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"><input id="pImage" type="file" accept="image/jpeg,image/png,image/webp" class="text-xs text-slate-300"><textarea id="pDescription" rows="3" placeholder="Descripción" class="md:col-span-2 bg-pix-bg border border-pix-border rounded-xl p-3 text-sm"></textarea><button class="md:col-span-2 bg-pix-blue text-slate-950 font-bold rounded-xl p-3">Guardar producto nuevo</button><p id="productMessage" class="md:col-span-2 text-xs"></p></form><h4 class="font-bold mt-6 mb-3">Productos publicados</h4><div id="storeProducts" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div></section></section></main>
<script>
let currentUser=null;const $=id=>document.getElementById(id);function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkAdmin(){const {data:{session}}=await db.auth.getSession();if(!session){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return}const {data,error}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(error||data?.role!=='admin'){await db.auth.signOut();$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');$('loginMessage').textContent='Esta cuenta no tiene permisos de administración.';return}currentUser=session.user;$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');await Promise.all([loadPending(),loadStoreProducts()])}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMessage').textContent='Ingresando...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMessage').textContent=error.message;return}await checkAdmin()});async function logout(){await db.auth.signOut();currentUser=null;checkAdmin()}
async function loadPending(){const {data,error}=await db.from('listings').select('*').eq('status','pending').order('created_at',{ascending:true});if(error){$('pendingList').textContent='Error: '+error.message;return}$('pendingCount').textContent=`(${data.length})`;$('pendingList').innerHTML=data.length?data.map(p=>`<article class="bg-pix-surface border border-pix-border rounded-2xl p-4"><div class="flex gap-3">${(p.image_urls||[]).slice(0,1).map(u=>`<img src="${esc(u)}" class="w-24 h-24 rounded-xl object-cover">`).join('')}<div class="min-w-0"><h4 class="font-bold">${esc(p.title)}</h4><p class="text-xs text-slate-400">${esc(p.category)} · ${new Date(p.created_at).toLocaleString('es-AR')}</p><p class="text-pix-electric font-bold mt-1">$ ${Number(p.price).toLocaleString('es-AR')}</p><p class="text-xs text-slate-300 mt-1">WhatsApp: ${esc(p.whatsapp)}</p></div></div><p class="text-sm text-slate-300 my-3">${esc(p.description||'')}</p><div class="flex gap-2"><button onclick="reviewListing('${p.id}','approved')" class="bg-emerald-500 text-slate-950 font-bold text-xs rounded-lg px-4 py-2">Aprobar</button><button onclick="reviewListing('${p.id}','rejected')" class="bg-rose-500 text-white font-bold text-xs rounded-lg px-4 py-2">Rechazar</button></div></article>`).join(''):'<p class="text-sm text-slate-400">No hay publicaciones pendientes.</p>'}
async function reviewListing(id,status){const {error}=await db.from('listings').update({status}).eq('id',id);if(error){alert('No se pudo actualizar: '+error.message);return}await loadPending()}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('productMessage').textContent='Guardando...';const file=$('pImage').files[0];let image_urls=[];if(file){if(file.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){$('productMessage').textContent='La imagen debe ser JPG, PNG o WebP y pesar hasta 5 MB.';return}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('pixbox-images').upload(path,file,{contentType:file.type});if(up.error){$('productMessage').textContent=up.error.message;return}image_urls=[db.storage.from('pixbox-images').getPublicUrl(path).data.publicUrl]}const {error}=await db.from('store_products').insert({title:$('pTitle').value.trim(),description:$('pDescription').value.trim(),category:$('pCategory').value,price:Number($('pPrice').value),image_urls,active:true});if(error){$('productMessage').textContent='Error: '+error.message;return}$('productMessage').textContent='Producto guardado correctamente.';$('productForm').reset();await loadStoreProducts()});
async function loadStoreProducts(){const {data,error}=await db.from('store_products').select('*').order('created_at',{ascending:false});if(error){$('storeProducts').textContent=error.message;return}$('storeProducts').innerHTML=(data||[]).map(p=>`<article class="bg-pix-surface border border-pix-border rounded-xl p-3">${(p.image_urls||[]).slice(0,1).map(u=>`<img src="${esc(u)}" class="w-full h-32 object-cover rounded-lg mb-2">`).join('')}<b class="text-sm">${esc(p.title)}</b><p class="text-xs text-pix-electric">$ ${Number(p.price).toLocaleString('es-AR')}</p><p class="text-xs text-slate-400">${p.active?'Activo':'Oculto'}</p><div class="flex gap-2 mt-2"><button onclick="toggleProduct('${p.id}',${!p.active})" class="text-xs border border-pix-border rounded-lg px-3 py-1">${p.active?'Ocultar':'Activar'}</button><button onclick="deleteProduct('${p.id}')" class="text-xs text-rose-300 border border-rose-900 rounded-lg px-3 py-1">Eliminar</button></div></article>`).join('')||'<p class="text-xs text-slate-400">Todavía no hay productos cargados.</p>'}
async function toggleProduct(id,active){const {error}=await db.from('store_products').update({active}).eq('id',id);if(error){alert(error.message);return}loadStoreProducts()}async function deleteProduct(id){if(!confirm('¿Eliminar este producto?'))return;const {error}=await db.from('store_products').delete().eq('id',id);if(error){alert(error.message);return}loadStoreProducts()}
checkAdmin();db.auth.onAuthStateChange(()=>setTimeout(checkAdmin,0));
</script></body></html>
